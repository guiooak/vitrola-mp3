<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrola Mp3 – Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../02-style-guide/tokens.css">
<link rel="stylesheet" href="mockup.css">
<script src="../02-style-guide/tokens.js"></script>
<script src="data.js"></script>
</head>
<body>

<div class="stage">
  <!-- Validation panel (desktop only) -->
  <aside class="panel" id="panel" aria-label="Mockup panel">
    <div class="panel-head">
      <img class="logo-p" src="../01-logo/export/vitrola-mp3-horizontal-positive.svg" alt="Vitrola Mp3">
      <img class="logo-n" src="../01-logo/export/vitrola-mp3-horizontal-negative.svg" alt="Vitrola Mp3">
      <p>Clickable mockup. Use the phone next to this panel like a real app, or jump straight to a screen here.</p>
    </div>

    <div class="panel-sec">
      <h2>Screens</h2>
      <nav class="jump" id="jump"></nav>
    </div>

    <div class="panel-sec">
      <h2>Simulate</h2>
      <div class="simulate">
        <button data-simulate="notification"><span class="ms">notifications</span>Media notification</button>
        <button data-simulate="lock-screen"><span class="ms">lock</span>Lock screen</button>
        <button data-simulate="reopen"><span class="ms">restart_alt</span>Close and reopen the app</button>
        <button data-simulate="headphones"><span class="ms">headset_off</span>Disconnect headphones</button>
        <button data-simulate="broken-file"><span class="ms">error</span>Broken file</button>
        <button data-simulate="lost-access"><span class="ms">folder_off</span>Lose folder access</button>
        <button data-simulate="car"><span class="ms">bluetooth_drive</span>Car Bluetooth connects / disconnects</button>
        <button data-simulate="rotate"><span class="ms">screen_rotation</span>Rotate phone (portrait / landscape)</button>
        <button data-simulate="reset"><span class="ms">refresh</span>Start over</button>
      </div>
    </div>

    <div class="panel-sec">
      <h2>Theme</h2>
      <div class="seg" id="panel-theme" role="group" aria-label="Theme">
        <button data-theme-choice="auto">Automatic</button><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button>
      </div>
    </div>

    <div class="panel-sec">
      <h2>About this screen</h2>
      <p id="screen-note"></p>
    </div>
  </aside>

  <!-- Phone -->
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="app" id="app">
        <div class="statusbar"><span id="clock">9:41</span><span class="sb-icons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_5_bar</span></span></div>
        <div class="screens" id="screens"></div>
        <div class="bottom" id="bottom">
          <div class="mini" id="mini" hidden></div>
          <nav class="bnav" id="bnav" aria-label="Main navigation">
            <button data-tab="library"><span class="pill"><span class="ms">library_music</span></span>Library</button>
            <button data-tab="playlists"><span class="pill"><span class="ms">queue_music</span></span>Playlists</button>
            <button data-tab="search"><span class="pill"><span class="ms">search</span></span>Search</button>
            <button data-tab="settings"><span class="pill"><span class="ms">settings</span></span>Settings</button>
          </nav>
        </div>
        <div class="np" id="np" aria-hidden="true"></div>
        <div class="overlay" id="overlay"></div>
        <div class="snack-area" id="snack-area"></div>
        <div class="gesture"></div>
      </div>
    </div>
  </div>
</div>

<button class="panel-fab" id="panel-fab" aria-label="Open the mockup panel"><span class="ms">chevron_right</span></button>

<script src="mockup.js"></script>
</body>
</html>
