# Publishes the design/ folder (landing page, logo, style guide and mockup) to GitHub Pages
# on every push to main that touches the design or this workflow.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "design/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a new push cancels whatever is still queued
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the site
        # Copies design/ without the generator scripts, which the site does not need
        run: |
          mkdir -p _site
          rsync -a --exclude 'scripts/' --exclude '*.py' --exclude 'images/README.txt' design/ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
